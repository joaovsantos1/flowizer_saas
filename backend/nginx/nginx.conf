worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # ─── Segurança básica ─────────────────────────────────────────────────────
    server_tokens off;           # não expor versão do Nginx
    client_max_body_size 2m;     # limite de upload
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;

    # ─── Logs (sem dados sensíveis) ───────────────────────────────────────────
    log_format main '$remote_addr - $request_method "$uri" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    # NUNCA logar query string ($args) — pode conter tokens/dados sensíveis
    access_log /var/log/nginx/access.log main;

    # ─── Rate limit no Nginx (primeira linha de defesa) ───────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ─── Redirect HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS principal ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name yourdomain.com;

        # ─── SSL/TLS ─────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;  # Apenas TLS 1.2+
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # ─── Headers de segurança ─────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ─── Rate limits por rota ─────────────────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=3 nodelay;
            limit_conn conn 10;
            proxy_pass http://app:3000;
            include /etc/nginx/proxy_params;
        }

        # ─── Rotas internas (n8n → backend) ──────────────────────────────────
        # NUNCA expor para a internet — apenas rede Docker interna da VPS
        location /api/v1/internal/ {
            allow 172.20.0.0/16;   # rede Docker (ajustar conforme sua subnet)
            allow 127.0.0.1;
            deny all;              # bloqueia TUDO que não for rede interna
            proxy_pass http://app:3000;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/webhooks/ {
            limit_req zone=webhooks burst=20 nodelay;
            proxy_pass http://app:3000;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/ {
            limit_req zone=api burst=10 nodelay;
            limit_conn conn 20;
            proxy_pass http://app:3000;
            include /etc/nginx/proxy_params;
        }

        # Bloquear acesso a arquivos sensíveis
        location ~ /\. {
            deny all;
        }
    }
}
