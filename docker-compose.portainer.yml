version: "3.9"

services:
  backend:
    image: ghcr.io/joaovsantos1/flowizer-backend:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=admin_net"
        - "traefik.http.routers.flowizer-api.rule=Host(`api.jves.tech`)"
        - "traefik.http.routers.flowizer-api.entrypoints=websecure"
        - "traefik.http.routers.flowizer-api.tls=true"
        - "traefik.http.routers.flowizer-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.flowizer-api.loadbalancer.server.port=3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      APP_URL: ${APP_URL}

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-false}

      REDIS_URL: ${REDIS_URL}

      WA_PROVIDER: ${WA_PROVIDER:-evolution}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID_MONTHLY: ${STRIPE_PRICE_ID_MONTHLY}
      STRIPE_TRIAL_DAYS: ${STRIPE_TRIAL_DAYS:-7}

      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}

      N8N_INTERNAL_SECRET: ${N8N_INTERNAL_SECRET}
      N8N_ALLOWED_IPS: ${N8N_ALLOWED_IPS:-172.0.0.0/8,127.0.0.1}

      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - backend_logs:/app/logs
    networks:
      - flowizer-net
      - admin_net

  frontend:
    image: ghcr.io/joaovsantos1/flowizer-frontend:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=admin_net"
        - "traefik.http.routers.flowizer-app.rule=Host(`jves.tech`) || Host(`www.jves.tech`)"
        - "traefik.http.routers.flowizer-app.entrypoints=websecure"
        - "traefik.http.routers.flowizer-app.tls=true"
        - "traefik.http.routers.flowizer-app.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.flowizer-app.loadbalancer.server.port=80"

    networks:
      - flowizer-net
      - admin_net
    depends_on:
      - backend

volumes:
  backend_logs:

networks:
  flowizer-net:
    external: true
  admin_net:
    external: true
